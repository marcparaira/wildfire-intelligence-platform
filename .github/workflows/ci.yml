name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - name: Start PostGIS
        working-directory: .
        run: docker compose up -d db
      - name: Wait for PostGIS
        working-directory: .
        run: |
          for attempt in $(seq 1 60); do
            if docker compose exec -T db psql -U wildfire -d wildfire -c 'SELECT PostGIS_Full_Version()' >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs db
          exit 1
      - name: Test API
        env:
          API_TEST_DATABASE_URL: postgresql://wildfire:wildfire_dev@localhost:55432/wildfire
        run: pytest

  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            packages/events/pyproject.toml
            services/ingestor/pyproject.toml
            services/sink-worker/pyproject.toml
      - run: >-
          pip install -e 'packages/events[dev]' -e 'services/ingestor[dev]'
          -e 'services/sink-worker[dev]'
      - run: ruff check packages/events services/ingestor services/sink-worker
      - name: Check registered schemas match the event models
        run: pytest packages/events/tests
      - run: docker compose up -d db kafka schema-registry
      - name: Wait for PostGIS, Kafka, and the schema registry
        run: |
          for attempt in $(seq 1 90); do
            if docker compose exec -T db psql -U wildfire -d wildfire -c 'SELECT PostGIS_Full_Version()' >/dev/null 2>&1 &&
               docker compose exec -T kafka /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1 &&
               curl -sf http://localhost:18081/subjects >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs db kafka schema-registry
          exit 1
      - name: Test ingestor
        env:
          INGESTOR_TEST_KAFKA: localhost:19092
          INGESTOR_TEST_SCHEMA_REGISTRY: http://localhost:18081
        run: pytest services/ingestor/tests
      - name: Test sink worker
        env:
          SINK_TEST_DATABASE_URL: postgresql://wildfire:wildfire_dev@localhost:55432/wildfire
          SINK_TEST_KAFKA: localhost:19092
          SINK_TEST_SCHEMA_REGISTRY: http://localhost:18081
        run: pytest services/sink-worker/tests

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build service images
        run: |
          docker build -f services/ingestor/Containerfile -t wildfire-ingestor .
          docker build -f services/sink-worker/Containerfile -t wildfire-sink-worker .
      - name: Smoke-test service images
        run: |
          docker run --rm wildfire-ingestor python -c "from wildfire_ingestor.countries import selected_countries; assert selected_countries().covers([(13.756, 100.502)]) == [True]"
          docker run --rm wildfire-sink-worker python -c "import wildfire_sink.service"
