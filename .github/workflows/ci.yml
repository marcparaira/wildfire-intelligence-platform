name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - name: Start PostGIS
        working-directory: .
        run: docker compose up -d db
      - name: Wait for PostGIS
        working-directory: .
        run: |
          for attempt in $(seq 1 60); do
            if docker compose exec -T db psql -U wildfire -d wildfire -c 'SELECT PostGIS_Full_Version()' >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs db
          exit 1
      - name: Test API
        env:
          API_TEST_DATABASE_URL: postgresql://wildfire:wildfire_dev@localhost:55432/wildfire
        run: pytest

  firms-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/firms-pipeline/pyproject.toml
      - run: pip install -e 'services/firms-pipeline[dev]'
      - run: ruff check services/firms-pipeline
      - run: docker compose up -d db kafka
      - name: Wait for PostGIS and Kafka
        run: |
          for attempt in $(seq 1 60); do
            if docker compose exec -T db psql -U wildfire -d wildfire -c 'SELECT PostGIS_Full_Version()' >/dev/null 2>&1 &&
               docker compose exec -T kafka /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs db kafka
          exit 1
      - name: Test ingestion and persistence
        env:
          PIPELINE_TEST_DATABASE_URL: postgresql://wildfire:wildfire_dev@localhost:55432/wildfire
          PIPELINE_TEST_KAFKA: localhost:19092
        run: pytest services/firms-pipeline/tests
