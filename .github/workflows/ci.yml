
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  python:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Podman and Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y podman podman-compose
          podman --version
          podman-compose --version

      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run basedpyright

      - name: Start integration services
        run: podman-compose up -d db kafka schema-registry

      - name: Wait for PostGIS, Kafka, and schema registry
        run: |
          for attempt in $(seq 1 90); do
            if podman-compose exec -T db \
                 psql -U wildfire -d wildfire \
                 -c 'SELECT PostGIS_Full_Version()' >/dev/null 2>&1 &&
               podman-compose exec -T kafka \
                 /opt/kafka/bin/kafka-broker-api-versions.sh \
                 --bootstrap-server localhost:9092 >/dev/null 2>&1 &&
               curl -sf http://localhost:18081/subjects >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          podman-compose logs db kafka schema-registry
          exit 1

      - name: Unit and integration tests
        env:
          API_TEST_DATABASE_URL: postgresql://wildfire:wildfire_dev@localhost:55432/wildfire
          INGESTOR_TEST_KAFKA: localhost:19092
          INGESTOR_TEST_SCHEMA_REGISTRY: http://localhost:18081
          SINK_TEST_DATABASE_URL: postgresql://wildfire:wildfire_dev@localhost:55432/wildfire
          SINK_TEST_KAFKA: localhost:19092
          SINK_TEST_SCHEMA_REGISTRY: http://localhost:18081
          PROCESSOR_TEST_KAFKA: localhost:19092
          PROCESSOR_TEST_SCHEMA_REGISTRY: http://localhost:18081
        run: uv run pytest

      - name: Show service logs on failure
        if: failure()
        run: podman-compose logs db kafka schema-registry

      - name: Stop integration services
        if: always()
        run: podman-compose down -v

  images:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman
          podman --version

      - name: Build service images
        run: |
          podman build -f services/ingestor/Containerfile -t wildfire-ingestor .
          podman build -f services/sink-worker/Containerfile -t wildfire-sink-worker .
          podman build -f services/stream-processor/Containerfile -t wildfire-stream-processor .
          podman build -f apps/api/Containerfile -t wildfire-api .

      - name: Smoke-test service images
        run: |
          podman run --rm wildfire-ingestor python -c "from wildfire_events.countries import selected_countries; assert selected_countries().covers([(13.756, 100.502)]) == [True]"
          podman run --rm wildfire-sink-worker python -c "import wildfire_sink.service"
          podman run --rm wildfire-stream-processor python -c "import wildfire_processor.service"
          podman run --rm wildfire-api python -c "import wildfire_api.main"
