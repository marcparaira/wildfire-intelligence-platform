[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wildfire-ingestor"
version = "0.2.0"
description = "Scheduled FIRMS and Open-Meteo producers"
requires-python = ">=3.12"
dependencies = [
    "wildfire-events",
    "wildfire-producers",
    "h3>=4.2,<5",
    "kafka-python>=2.2,<3",
    "pydantic>=2.10,<3",
]

[project.scripts]
wildfire-ingestor = "wildfire_ingestor.service:main"

[tool.setuptools.packages.find]
where = ["src"]

