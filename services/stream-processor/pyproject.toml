[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wildfire-stream-processor"
version = "0.1.0"
description = "Stateful stream processing (incidents, enrichment, statistics) with Quix Streams"
requires-python = ">=3.12"
dependencies = [
    "wildfire-events",
    "h3>=4.2,<5",
    "pydantic>=2.10,<3",
    "quixstreams>=3.28,<4",
]

[project.scripts]
wildfire-stream-processor = "wildfire_processor.service:main"

[tool.setuptools.packages.find]
where = ["src"]
