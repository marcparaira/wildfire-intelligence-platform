[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wildfire-imagery-worker"
version = "0.1.0"
description = "Scheduled NASA GIBS and Sentinel-2 imagery of fire incidents"
requires-python = ">=3.12"
dependencies = [
    "wildfire-events",
    "wildfire-producers",
    "kafka-python>=2.2,<3",
    "pillow>=11,<13",
    "pydantic>=2.10,<3",
]

[project.scripts]
wildfire-imagery-worker = "wildfire_imagery.service:main"

[tool.setuptools.packages.find]
where = ["src"]
