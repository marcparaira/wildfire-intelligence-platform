[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wildfire-firms-pipeline"
version = "0.1.0"
description = "FIRMS ingestion and PostGIS processing"
requires-python = ">=3.12"
dependencies = [
    "kafka-python>=2.2,<3",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.10,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wildfire_firms = ["data/*.geojson"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
