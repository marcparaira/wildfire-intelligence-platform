[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wildfire-sink-worker"
version = "0.2.0"
description = "Kafka-to-PostGIS projections"
requires-python = ">=3.12"
dependencies = [
    "wildfire-events",
    "h3>=4.2,<5",
    "kafka-python>=2.2,<3",
    "pydantic>=2.10,<3",
    "psycopg[binary]>=3.2,<4",
]

[project.scripts]
wildfire-sink-worker = "wildfire_sink.service:main"

[tool.setuptools.packages.find]
where = ["src"]
