[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wildfire-producers"
version = "0.1.0"
description = "Runtime shared by the scheduled producer services: scheduling, publishing, and log reads"
requires-python = ">=3.12"
dependencies = [
    "wildfire-events",
    "kafka-python>=2.2,<3",
    "pydantic>=2.10,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wildfire_producers = ["py.typed"]
