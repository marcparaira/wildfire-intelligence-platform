[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wildfire-events"
version = "0.2.0"
description = "Shared Kafka topics, event schemas, and schema-registry codec"
requires-python = ">=3.12"
dependencies = [
    "h3>=4.2,<5",
    "kafka-python>=2.2,<3",
    "numpy>=2,<3",
    "pydantic>=2.10,<3",
    "shapely>=2.0,<3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wildfire_events = ["schemas/*.json", "data/*.geojson"]
