[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "wildfire-api"
version = "0.2.0"
description = "Wildfire Intelligence Platform API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "wildfire-events",
    "fastapi>=0.115,<1.0",
    "kafka-python>=2.2,<3",
    "psycopg[binary]>=3.2,<4",
    "uvicorn>=0.34,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
